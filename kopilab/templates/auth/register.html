{% extends "base.html" %}
{% block title %}Daftar{% endblock %}
{% block content %}<section class="auth-card"><p class="eyebrow">MEMBER KOPILAB</p><h1>Buat akun baru</h1>
<form method="post"><label>Username<input name="username" autocomplete="username" required></label><label>Email<input name="email" type="email" autocomplete="email"></label><label>Password<input name="password" type="password" autocomplete="new-password" required></label><button class="button button-primary button-wide">Daftar</button></form>
<p>Sudah punya akun? <a href="{{ url_for('auth.login') }}">Masuk</a></p></section>{% endblock %}
